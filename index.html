<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>医学统计学 · 答题卡</title>
<style>
:root{
  --paper:#F7F9FA; --sheet:#FFFFFF; --ink:#173B57; --ink-soft:#4C6273;
  --red:#C3402C; --green:#1F7A63; --line:#DCE5EA; --grid:rgba(23,59,87,.055);
  --display:"Songti SC","STSong","SimSun",Georgia,serif;
  --body:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
.wrap{max-width:780px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--line);background:rgba(255,255,255,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.bar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.06em;font-weight:600}
.seal{width:24px;height:24px;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--display);font-size:15px;border-radius:3px;letter-spacing:0}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;color:var(--ink-soft)}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
.ghost b{font-family:var(--mono);color:var(--red)}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.hero{padding:52px 0 26px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
h1{font-family:var(--display);font-size:clamp(36px,7vw,60px);line-height:1.14;letter-spacing:.02em;margin:0;color:var(--ink)}
.lede{font-size:15px;line-height:1.8;color:var(--ink-soft);max-width:560px;margin:20px 0 0}
.marks{display:flex;gap:5px;flex-wrap:wrap}
.mark{width:13px;height:13px;border:1.5px solid #BACBD6;border-radius:2px;background:#fff;display:block}
.mark.done{background:var(--green);border-color:var(--green)}
.mark.bad{background:var(--red);border-color:var(--red)}
.mark.marked{background:#7E9AAE;border-color:#7E9AAE}
.mark.now{outline:2px solid var(--ink);outline-offset:2px}
.hero .marks{margin-top:30px}
.marknote{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.04em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden;margin:8px 0 30px}
.stats>div{padding:18px 20px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-soft)}

.panel{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:6px 20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.label{font-size:14px;font-weight:600}
.segment{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.segment button{border:0;border-right:1px solid var(--line);background:transparent;padding:8px 14px;font-size:13px;color:var(--ink-soft)}
.segment button:last-child{border-right:0}
.segment button[aria-pressed="true"]{background:var(--ink);color:#fff}
.section-title{font-family:var(--display);font-size:23px;margin:38px 0 16px;display:flex;align-items:baseline;gap:12px}
.section-title small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--ink-soft)}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.topic{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:82px;justify-content:space-between}
.topic:hover{border-color:var(--ink)}
.topic[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#F2F7FA}
.tname{font-size:15px;font-weight:600}
.tnum{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.topic[aria-pressed="true"] .tnum{color:var(--ink)}
.startbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:34px 0 60px}
.cta{background:var(--ink);color:#fff;border:0;border-radius:11px;padding:15px 26px;font-size:16px;font-weight:600;letter-spacing:.03em}
.cta:hover{background:#0F2C42}
.cta span{margin-left:10px}
.fineprint{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.6}

.strip{padding:24px 0 18px}
.progress-text{font-family:var(--mono);font-size:13px;letter-spacing:.08em}
.timer{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:32px;margin-bottom:18px;box-shadow:0 6px 26px rgba(23,59,87,.05)}
.qmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);font-family:var(--mono);border-bottom:1px dashed var(--line);padding-bottom:14px;margin-bottom:22px}
.qmeta .sp{flex:1}
.link{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px;font-family:var(--body)}
.link:hover{border-color:var(--red);color:var(--red)}
.stem{font-size:20px;line-height:1.75;font-weight:600;margin:0 0 26px;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:11px;background:var(--sheet);text-align:left;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.box{flex:0 0 20px;width:20px;height:20px;border:2px solid #AFC2CE;border-radius:3px;position:relative;margin-top:2px}
.box::after{content:"";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-family:var(--mono);line-height:1}
.otext{font-size:15px;line-height:1.65;word-break:break-word}
.otext b{font-family:var(--mono);margin-right:8px;color:var(--ink-soft)}
.opt.selected{border-color:var(--ink);background:#F4F8FA}
.opt.selected .box{background:var(--ink);border-color:var(--ink)}
.opt.selected .box::after{content:"✓"}
.opt.correct{border-color:var(--green);background:#F1F8F5}
.opt.correct .box{background:var(--green);border-color:var(--green)}
.opt.correct .box::after{content:"✓"}
.opt.wrong{border-color:var(--red);background:#FCF3F1}
.opt.wrong .box{background:var(--red);border-color:var(--red)}
.opt.wrong .box::after{content:"✕"}
.opt.correct .box,.opt.wrong .box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.5}to{transform:scale(1);opacity:1}}
.feedback{margin-top:22px;padding:16px 18px;border-radius:11px;border-left:4px solid var(--green);background:#F1F8F5;animation:rise .25s ease-out}
.feedback.bad{border-left-color:var(--red);background:#FCF3F1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fbhead{font-weight:700;font-size:15px;margin-bottom:6px}
.feedback p{font-size:13px;line-height:1.75;margin:4px 0;color:var(--ink-soft)}
.feedback b{font-family:var(--mono);color:var(--ink);font-size:15px}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:60px}
.hint{font-size:13px;color:var(--red);min-height:18px}

.result{padding:46px 0 60px}
.score{font-family:var(--display);display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.score b{font-size:76px;line-height:1;color:var(--ink)}
.score span{font-family:var(--mono);font-size:20px;color:var(--ink-soft)}
.review{margin-top:34px}
.review h2{font-family:var(--display);font-size:23px;margin:0 0 14px}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:16px 18px;margin-bottom:10px}
.rev .rt{font-size:14px;line-height:1.7;margin:0 0 8px}
.rev .ra{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.rev .ra b{color:var(--green)}
.rev .ra i{color:var(--red);font-style:normal}
.empty{border:1px dashed var(--line);border-radius:14px;padding:44px 24px;text-align:center;color:var(--ink-soft);background:var(--sheet)}
.empty h2{font-family:var(--display);font-size:22px;color:var(--ink);margin:0 0 8px}
.empty p{font-size:14px;margin:0 0 20px}
.wlist{display:flex;flex-direction:column;gap:10px;margin:22px 0}
.witem{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:16px 18px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.witem p{margin:0 0 8px;font-size:14px;line-height:1.7}
.witem .small{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.witem .small b{color:var(--green)}
.linkbtn{background:transparent;border:0;border-bottom:1px solid var(--line);padding:0 0 1px;font-size:12px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.linkbtn:hover{border-color:var(--red);color:var(--red)}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(12,26,38,.95);display:flex;flex-direction:column;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.viewer .vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.18);color:#fff}
.viewer .vtitle{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.viewer .vbtns{display:flex;gap:8px;flex-wrap:wrap}
.viewer .vbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
.viewer .vbtn[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.viewer .vstage{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.viewer img{max-width:100%;height:auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.viewer .vnote{color:rgba(255,255,255,.6);font-size:12px;padding:0 18px 14px;text-align:center}
.bar-actions{display:flex;gap:8px;align-items:center}
.sheet{position:fixed;inset:0;z-index:25;background:rgba(12,26,38,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet .card{background:var(--sheet);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.sheet .sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;font-family:var(--mono)}
.sheet .flabel{font-size:13px;font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px;resize:vertical}
.ctx{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:12px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tlist{display:flex;flex-direction:column;gap:10px;margin:20px 0}
.titem{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:14px 16px}
.titem .th{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink-soft);font-family:var(--mono);margin-bottom:8px;flex-wrap:wrap}
.titem p{margin:0 0 8px;font-size:14px;line-height:1.7}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;background:#EDF2F5;color:var(--ink);font-size:11px}
.titem .tmeta{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:40;font-size:13px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media(max-width:640px){
  .wrap{padding:0 16px}
  .hero{padding:34px 0 20px}
  .qcard{padding:22px 16px}
  .stem{font-size:18px}
  .stats>div{padding:14px 12px}
  .stats b{font-size:21px}
  .row{flex-direction:column;align-items:flex-start;gap:10px}
  .topic-grid{grid-template-columns:repeat(2,1fr)}
  .topic{padding:13px;min-height:72px}
  .qfoot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:rgba(247,249,250,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
  .score b{font-size:60px}
  .viewer .vhead{padding:10px 12px}
  .viewer .vstage{padding:8px}
  .bar-actions .ghost{padding:7px 9px;font-size:12px}
}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
@media(max-width:480px){
  .bar{height:54px}
  .brand{font-size:12px;letter-spacing:0}
  .progress-text{font-size:12px}
  .qmeta{gap:8px;font-size:11px}
  .opt{padding:14px;min-height:50px}
  .qfoot{gap:8px;flex-wrap:wrap}
  .qfoot .ghost,.qfoot .cta{padding:12px 14px;font-size:14px}
  .qfoot .cta{margin-left:auto}
  .qfoot .hint{order:3;flex-basis:100%;text-align:center;min-height:0}
  .viewer .vbtn{padding:8px 10px;font-size:12px}
  .stats>div span{font-size:11px}
  .topic-grid{gap:8px}
  .sheet .card{padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  .chip{padding:8px 12px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script src="questions.js?v=39e969ab"></script>
<script src="feedback-config.js?v=b920c553"></script>
<script>
(function(){
"use strict";
var DATA = (window.QUIZ_DATA || []).slice();
var app = document.getElementById('app');
var ABCD = ['A','B','C','D'];
var K = {wrong:'quiz_wrong_v1', flag:'quiz_flag_v1', hist:'quiz_hist_v1',
         stat:'quiz_stat_v1', sess:'quiz_session_v1'};
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var store = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
var st = {view:'home', topic:'__all__', mode:'instant', count:10,
          queue:[], i:0, chosen:{}, results:[], started:0, elapsed:0, locked:false, hint:''};
var tick = null;
var viewer = null;
var FB = window.QUIZ_FEEDBACK_CONFIG || {channel:'local',target:'',appVersion:'2',contactHint:''};
var KT = 'quiz_tickets_v1';
var CATS = [
  {k:'answer_wrong', label:'答案不对'},
  {k:'text_broken', label:'题目/选项缺字'},
  {k:'interaction', label:'点不动 / 交互问题'},
  {k:'layout', label:'排版显示问题'},
  {k:'other', label:'其他'}
];
var fbDraft = null;
var toastTimer = null;
var topics = DATA.map(function(q){return q.topic;}).filter(function(v,i,a){return a.indexOf(v)===i;});

/* 题型策略：以后加题型只需在这里加一行，判分逻辑不用改 */
var TYPES = {
  single:   {label:'单选题', multi:false},
  multiple: {label:'多选题', multi:true},
  judge:    {label:'判断题', multi:false}
};
function typeOf(q){ return TYPES[q.type] ? q.type : 'single'; }
function answerArray(q){
  var a = q.answer;
  return (Array.isArray(a) ? a.slice() : (a ? [a] : [])).sort();
}
function chosenArray(v){
  var a = Array.isArray(v) ? v.slice() : (v ? [v] : []);
  return a.sort();
}
function isCorrect(q, chosen){
  var a = chosenArray(chosen), b = answerArray(q);
  return a.length === b.length && a.every(function(x,i){ return x === b[i]; });
}
function optionKeys(q){
  if(typeOf(q)==='judge') return ['T','F'];
  var ks = Object.keys(q.options||{}).filter(function(k){
    return k.length===1 && k>='A' && k<='F' && (q.options[k]||'').trim();
  });
  ks.sort();
  return ks.length ? ks : ['A','B','C','D'];
}
function optionLabel(q,k){ return typeOf(q)==='judge' ? (k==='T'?'正确':'错误') : k; }

function fmt(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function mmss(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function topicCount(t){ return t==='__all__' ? DATA.length : DATA.filter(function(q){return q.topic===t;}).length; }
function pool(){
  return st.topic==='__all__' ? DATA.slice() : DATA.filter(function(q){return q.topic===st.topic;});
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function marksHtml(list, current){
  return list.map(function(x,i){
    var c = x==='right' ? 'done' : x==='wrong' ? 'bad' : x==='marked' ? 'marked' : (i===current ? 'now' : '');
    return '<i class="mark '+c+'"></i>';
  }).join('');
}
function bar(right, middle, left){
  return '<header class="topbar"><div class="wrap bar">'+right+middle+left+'</div></header>';
}

/* 会话持久化：页面被刷新或浏览器重载后回到原题 */
function byId(id){
  for(var i=0;i<DATA.length;i++){ if(DATA[i].id===id) return DATA[i]; }
  return null;
}
function saveSession(){
  if(st.view==='home'){ store.del(K.sess); return; }
  if(st.view!=='quiz' && st.view!=='result') return;
  store.set(K.sess, {
    view:st.view, topic:st.topic, mode:st.mode, count:st.count,
    queue:st.queue.map(function(q){return q.id;}),
    i:st.i, chosen:st.chosen, locked:st.locked,
    started:st.started, elapsed:st.elapsed,
    results:st.results.map(function(r){return {id:r.q.id, chosen:r.chosen, correct:r.correct};})
  });
}
function restoreSession(){
  var s = store.get(K.sess, null);
  if(!s || (s.view!=='quiz' && s.view!=='result')) return false;
  var queue = (s.queue||[]).map(byId).filter(Boolean);
  if(!queue.length) return false;
  st.view = s.view;
  st.topic = s.topic || '__all__';
  st.mode = s.mode || 'instant';
  st.count = s.count || 10;
  st.queue = queue;
  st.i = Math.min(s.i||0, queue.length-1);
  st.chosen = s.chosen || {};
  st.locked = !!s.locked;
  st.started = s.started || Date.now();
  st.elapsed = s.elapsed || 0;
  st.results = (s.results||[]).map(function(r){
    var q = byId(r.id);
    return q ? {q:q, chosen:r.chosen, correct:r.correct} : null;
  }).filter(Boolean);
  st.hint = '';
  return true;
}

/* 应用内看图：不跳新标签页，关闭后仍停在本题 */
function renderViewer(){
  var el = document.getElementById('viewer');
  if(!viewer || !viewer.q){
    if(el && el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  var q = viewer.q;
  var src = viewer.which==='clean' ? (q.clean_image || q.image) : q.image;
  var html = '<div class="viewer" id="viewer" role="dialog" aria-label="原卷页面图">'+

function optionHtml(q){

    var cls = 'opt';

      if(correct.indexOf(k)>=0) cls+=' correct';
      else if(chosen.indexOf(k)>=0) cls+=' wrong';
    } else if(chosen.indexOf(k)>=0) cls+=' selected';
    var text = judge ? optionLabel(q,k) : (q.options[k] || '');
    var lead = judge ? '' : '<b>'+k+'</b>';
    return '<button class="'+cls+'" data-act="choose" data-v="'+k+'"'+(st.locked?' disabled':'')+'>'+
      '<span class="box"></span><span class="otext">'+lead+esc(text)+'</span></button>';
  }).join('');
}
function feedbackHtml(q){
  var ok = isCorrect(q, st.chosen[q.id]);
  var correct = answerArray(q);
  var judge = typeOf(q)==='judge';
  var detail = correct.map(function(k){
    return judge ? optionLabel(q,k) : (q.options[k] || '');
  }).join('；');
  return '<div class="feedback'+(ok?'':' bad')+'" role="status">' +
    '<div class="fbhead">'+(ok?'答对了':'答错了')+'</div>' +
    '<p>正确答案 <b>'+correct.join('、')+'</b> · '+esc(detail)+'</p>' +
    (judge ? '' : '<p>如果题干或选项读着别扭，多半是 OCR 误识，点上方「原卷 / 去红版」核对原卷。</p>') +
    '</div>';
}

function startWith(list, instant){
  if(!list.length){ st.hint='这个专题暂时没有题'; renderHome(); return; }
  st.queue = shuffle(list.slice());
  st.i = 0; st.chosen = {}; st.results = []; st.started = Date.now();
  st.locked = false; st.hint = ''; st.view = 'quiz';
  if(instant === true) st.mode = 'instant';
  render();
}
function finish(){
  st.elapsed = Date.now() - st.started;
  st.results = st.queue.map(function(q){
    return {q:q, chosen:st.chosen[q.id]||'', correct:isCorrect(q, st.chosen[q.id])};
  });
  var stat = store.get(K.stat,{done:0,right:0});
  var hist = store.get(K.hist,[]);
  var wrong = store.get(K.wrong,[]);
  st.results.forEach(function(r){
    stat.done += 1;
    if(r.correct){
      stat.right += 1;
      var k = wrong.indexOf(r.q.id); if(k>=0) wrong.splice(k,1);
    } else if(wrong.indexOf(r.q.id)<0) wrong.push(r.q.id);
    hist.push(r.correct?'right':'wrong');
  });
  store.set(K.stat,stat);
  store.set(K.hist,hist.slice(-200));
  store.set(K.wrong,wrong);
  st.view = 'result';
  render();
}
function next(){
  var q = st.queue[st.i];
  if(st.mode==='instant' && !chosenArray(st.chosen[q.id]).length){
    st.hint='先选一个答案'; renderQuiz(); return;
  }
  if(st.mode==='instant' && TYPES[typeOf(q)].multi && !st.locked){
    st.locked = true; st.hint = ''; renderQuiz(); return;
  }
  st.hint = '';
  if(st.i === st.queue.length-1){ finish(); return; }
  st.i += 1; st.locked = false; render();
}
function choose(k){
  var q = st.queue[st.i];
  if(st.locked) return;
  if(TYPES[typeOf(q)].multi){
    var arr = chosenArray(st.chosen[q.id]);
    var at = arr.indexOf(k);
    if(at>=0) arr.splice(at,1); else arr.push(k);
    st.chosen[q.id] = arr;
    st.hint = arr.length ? '已选 '+arr.length+' 项，点「确认答案」' : '';
    renderQuiz();
    return;
  }
  if(st.mode==='instant' && chosenArray(st.chosen[q.id]).length) return;
  st.chosen[q.id] = [k];
  st.hint = '';
  if(st.mode==='instant') st.locked = true;
  renderQuiz();
}
function toggleFlag(){
  var q = st.queue[st.i];
  var f = store.get(K.flag,[]);
  var i = f.indexOf(q.id);
  if(i>=0) f.splice(i,1); else f.push(q.id);
  store.set(K.flag,f);
  renderQuiz();
}

/* ---- 反馈工单：本地工单本 + 导出 + 可切换的线上通道 ---- */
function catLabel(k){
  for(var i=0;i<CATS.length;i++){ if(CATS[i].k===k) return CATS[i].label; }
  return '其他';
}
function getTickets(){
  var t = store.get(KT, []);
  return Array.isArray(t) ? t : [];
}
function toast(msg){
  var el = document.getElementById('toast');
  if(!el){
    if(!document.createElement || !document.body || !document.body.appendChild) return;
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 2800);
}
function feedbackContext(q){
  var s = q.source || {};
  return {
    app_version: FB.appVersion,
    bank: q.bank || '-',
    question_version: q.version || 1,
    question_id: q.id,
    page: s.page || q.page || '-',
    question_no: s.no || q.no || '-',
    type: TYPES[typeOf(q)].label,
    url: typeof location!=='undefined' ? location.href : '-',
    user_agent: typeof navigator!=='undefined' ? navigator.userAgent : '-',
    screen: typeof screen!=='undefined' ? (screen.width+'x'+screen.height) : '-',
    quiz_mode: st.mode,
    quiz_position: st.view==='quiz' ? ('第 '+(st.i+1)+' / '+st.queue.length+' 题') : '-'
  };
}
function ticketBody(t){
  var c = t.context || {};
  return [
    '【题库反馈】'+t.id,
    '时间：'+t.created,
    '分类：'+catLabel(t.category),
    '题库：'+t.bank+'　题目版本：'+c.question_version,
    '题目：'+t.question_id+'（第 '+c.page+' 页 · 原题 '+c.question_no+'）',
    '题型：'+c.type+'　应用版本：'+c.app_version,
    '页面：'+c.url,
    '设备：'+c.user_agent,
    '屏幕：'+c.screen+'　模式：'+c.quiz_mode+'　位置：'+c.quiz_position,
    '',
    '问题描述：',
    t.message || '（未填写）'
  ].join('\n');
}
function openFeedback(q){
  fbDraft = {q:q, category:'answer_wrong'};
  try{ history.pushState({quizViewer:true}, ''); }catch(e){}
  renderFeedbackSheet();
}
function closeFeedback(back){
  if(!fbDraft) return;
  fbDraft = null;
  renderFeedbackSheet();
  if(back!==false){ try{ if(history.state&&history.state.quizViewer) history.back(); }catch(e){} }
}
function renderFeedbackSheet(){
  var el = document.getElementById('fbsheet');
  if(!fbDraft){
    if(el && el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  if(el) return;
  var q = fbDraft.q;
  var s = q.source || {};
  var chips = CATS.map(function(c){
    return '<button class="chip" data-act="fbcat" data-v="'+c.k+'" aria-pressed="'+(fbDraft.category===c.k)+'">'+esc(c.label)+'</button>';
  }).join('');
  var html = '<div class="sheet" id="fbsheet"><div class="card">'+
    '<h2>反馈这道题</h2>'+
    '<p class="sub">'+esc(q.id)+' · 第 '+(s.page||q.page||'-')+' 页 · '+TYPES[typeOf(q)].label+'</p>'+
    '<p class="flabel">遇到了什么？</p><div class="chips">'+chips+'</div>'+
    '<p class="flabel">具体描述</p>'+
    '<textarea id="fbmsg" placeholder="比如：正确答案应该是 C，或者某个选项缺字、按钮点不动"></textarea>'+
    '<div class="ctx">自动带上的问题现场（不用填）：<br>'+esc(JSON.stringify(feedbackContext(q), null, 1))+'</div>'+
    '<div class="actions">'+
      '<button class="ghost" data-act="fbclose">取消</button>'+
      '<button class="cta" data-act="fbsubmit">保存到反馈本</button>'+
    '</div></div></div>';
  if(document.body && document.body.insertAdjacentHTML) document.body.insertAdjacentHTML('beforeend', html);
}
function newTicket(q, category, message){
  var c = feedbackContext(q);
  var d = new Date();
  return {
    id: 'FB-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8),
    created: d.toISOString(),
    bank: q.bank||'-', question_id: q.id,
    page: c.page, question_no: c.question_no, type: c.type,
    category: category, message: message||'',
    context: c, exported: false, note: ''
  };
}
function submitFeedback(){
  if(!fbDraft) return;
  var ta = document.getElementById('fbmsg');
  var msg = ta && typeof ta.value==='string' ? ta.value.trim() : '';
  var t = newTicket(fbDraft.q, fbDraft.category, msg);
  var list = getTickets();
  list.push(t);
  store.set(KT, list);
  if(FB.channel==='link' && FB.target && typeof window.open==='function'){
    var title = '[题库反馈] '+catLabel(t.category)+' · '+t.question_id;
    var url = FB.target.replace('{title}', encodeURIComponent(title))
                       .replace('{body}', encodeURIComponent(ticketBody(t)));
    window.open(url, '_blank', 'noopener');
    t.exported = true;
    store.set(KT, list);
  } else if(FB.channel==='mailto' && FB.target){
    try{
      window.location.href = 'mailto:'+FB.target+'?subject='+
        encodeURIComponent('[题库反馈] '+t.question_id)+'&body='+encodeURIComponent(ticketBody(t));
    }catch(e){}
  } else if(FB.channel==='api' && FB.target && typeof fetch==='function'){
    try{
      fetch(FB.target, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(t)
      }).then(function(r){
        if(r && r.ok){
          var ls = getTickets();
          ls.forEach(function(x){ if(x.id===t.id) x.exported = true; });
          store.set(KT, ls);
          toast('反馈已提交，谢谢');
        } else {
          toast('提交没成功，已存在本机，可导出文件发给作者');
        }
      }).catch(function(){
        toast('提交没成功，已存在本机，可导出文件发给作者');
      });
    }catch(e){}
  }
  fbDraft = null;
  renderFeedbackSheet();
  try{ if(history.state&&history.state.quizViewer) history.back(); }catch(e){}
  toast('已保存到反馈本，记得导出发给作者');
}
function exportTickets(){
  var list = getTickets();
  if(!list.length){ toast('还没有反馈记录'); return; }
  var name = '题库反馈_'+new Date().toISOString().slice(0,10)+'_'+Math.random().toString(36).slice(2,7)+'.json';
  try{
    var a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(list,null,2));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    list.forEach(function(t){ t.exported = true; });
    store.set(KT, list);
    toast('已导出 '+name+'，发给作者即可');
  }catch(e){
    toast('导出失败，请截图反馈本内容');
  }
  render();
}
function renderTickets(){
  var list = getTickets().slice().reverse();
  var body = list.length ?
    '<div class="tlist">'+list.map(function(t){
      return '<div class="titem">'+
        '<div class="th"><span>'+esc(t.id)+'</span><span>'+esc((t.created||'').slice(0,19).replace('T',' '))+'</span></div>'+
        '<p><span class="tag">'+esc(catLabel(t.category))+'</span>　'+esc(t.question_id)+' · 第 '+esc(String(t.page))+' 页</p>'+
        '<p>'+esc(t.message || '（未填写描述）')+'</p>'+
        '<div class="tmeta">'+(t.exported?'已导出':'待发送')+'　'+
          '<button class="linkbtn" data-act="fdel" data-v="'+esc(t.id)+'">删除</button></div>'+
      '</div>';
    }).join('')+'</div>'+
    '<div class="startbar">'+
      '<button class="cta" data-act="fexport">导出反馈文件 <span>→</span></button>'+
      '<button class="ghost" data-act="fclear">清空反馈本</button>'+
    '</div>'
    : '<div class="empty"><h2>还没有反馈</h2>'+
      '<p>做题时点题目上方的「反馈这道题」，问题会自动带好现场信息。</p>'+
      '<button class="cta" data-act="home">去做一套题</button></div>';
  app.innerHTML =
    bar('<button class="ghost" data-act="home">← 返回</button>',
        '<div class="progress-text">反馈本 · '+list.length+' 条</div>','') +
    '<main class="wrap"><section class="result" style="padding-top:34px">'+
      '<p class="eyebrow">Feedback / 问题反馈</p>'+
      '<h1 style="font-size:38px;margin:0 0 6px">我的反馈</h1>'+
      '<p class="lede">'+esc(FB.contactHint || '导出反馈文件后发给作者即可')+
        '。反馈只存在这台设备上，换设备或清缓存前记得导出。</p>'+ body +
    '</section></main>';
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var act = b.dataset.act, v = b.dataset.v;
  if(act==='vopen'){
    var pair = (v||'').split(':');
    openViewer(pair[0], pair[1]);
  }
  else if(act==='vsrc'){
    if(viewer){ viewer.which = v==='clean' ? 'clean' : 'image'; renderViewer(); }
  }
  else if(act==='vclose'){ closeViewer(); }
  else if(act==='feedback'){ var fq=byId(v); if(fq) openFeedback(fq); }
  else if(act==='fbcat'){
    if(fbDraft){
      fbDraft.category = v;
      var chips = document.querySelectorAll ? document.querySelectorAll('.chip') : [];
      for(var ci=0;ci<chips.length;ci++){
        chips[ci].setAttribute('aria-pressed', String(chips[ci].dataset.v===v));
      }
    }
  }
  else if(act==='fbclose'){ closeFeedback(); }
  else if(act==='fbsubmit'){ submitFeedback(); }
  else if(act==='tickets'){ st.view='tickets'; render(); }
  else if(act==='fexport'){ exportTickets(); }
  else if(act==='fdel'){
    store.set(KT, getTickets().filter(function(t){return t.id!==v;}));
    render();
  }
  else if(act==='fclear'){ store.set(KT, []); render(); }
  else if(act==='topic'){ st.topic=v; renderHome(); }
  else if(act==='mode'){ st.mode=v; renderHome(); }
  else if(act==='count'){ st.count=parseInt(v,10); renderHome(); }
  else if(act==='start'){
    var p = shuffle(pool());
    startWith(st.count ? p.slice(0,st.count) : p);
  }
  else if(act==='wrongbook'){ st.view='wrongbook'; render(); }
  else if(act==='home' || act==='exit'){ st.view='home'; render(); }
  else if(act==='choose'){ choose(v); }
  else if(act==='next'){ next(); }
  else if(act==='flag'){ toggleFlag(); }
  else if(act==='redo'){ startWith(st.results.filter(function(r){return !r.correct;}).map(function(r){return r.q;})); }
  else if(act==='practiceWrong'){
    var ids = store.get(K.wrong,[]);
    startWith(DATA.filter(function(q){return ids.indexOf(q.id)>=0;}), true);
  }
  else if(act==='drop'){
    var w = store.get(K.wrong,[]); var j = w.indexOf(v);
    if(j>=0) w.splice(j,1);
    store.set(K.wrong,w); render();
  }
});
document.addEventListener('keydown', function(e){
  if(fbDraft){
    if(e.key==='Escape'){ closeFeedback(); }
    return;
  }
  if(viewer){
    if(e.key==='Escape'){ closeViewer(); }
    return;
  }
  if(st.view!=='quiz') return;
  var k = e.key.toUpperCase();
  if(/^[1-4]$/.test(k)){ choose(ABCD[parseInt(k,10)-1]); return; }
  if(/^[A-D]$/.test(k)){ choose(k); return; }
  if(e.key==='Enter'){ next(); return; }
  if(e.key==='Escape'){ st.view='home'; render(); }
});
window.addEventListener('popstate', function(){
  if(viewer){ viewer=null; renderViewer(); }
  if(fbDraft) closeFeedback(false);
});
restoreSession();
render();
})();
</script>
</body>
</html>
